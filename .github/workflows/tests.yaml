name: Tests

on:
  pull_request:
    branches:
    - main
    - dev
  push:
    branches:
    - main
    - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.15.2'
        architecture: x64

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: '0.13.6'
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: |
        uv sync --locked
        uv pip install --python .venv/bin/python pre-commit==4.7.0

    - name: Run isolated tests and deployment health checks
      run: make tests

    - name: Run linters
      run: make linters

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        disable_search: true
        fail_ci_if_error: true
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Clean up isolated test services
      if: always()
      run: >-
        docker compose -p shorty_tests -f compose.test.yaml
        down --volumes --remove-orphans
