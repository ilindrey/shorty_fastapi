services:
  api:
    build:
      context: .
      target: production
    command: >
      sh -c "alembic upgrade head &&
             uvicorn shorty.entrypoints.fastapi_app:app --host 0.0.0.0 --port 80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &test-environment
      DATABASE_URL: postgresql+asyncpg://test:test@postgres:5432/shorty_test
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET_KEY: test-only-secret
      LINK_TTL_DAYS: 14
      CLEANUP_INTERVAL_MINUTES: 60
      CLEANUP_BATCH_SIZE: 100
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "from urllib.request import urlopen; urlopen('http://localhost/health').read()"
      interval: 1s
      timeout: 5s
      retries: 15

  scheduler:
    build:
      context: .
      target: production
    command: python -m shorty.entrypoints.scheduler
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *test-environment

  tests:
    build:
      context: .
      target: test
    command: pytest --cov=shorty --cov-branch --cov-report=xml .
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *test-environment
      DEPLOYED_API_URL: http://api

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: shorty_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d shorty_test"]
      interval: 1s
      timeout: 5s
      retries: 10
    tmpfs:
    - /var/lib/postgresql

  redis:
    image: redis:8.10.1-alpine3.23
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 10
    tmpfs:
    - /data
