version: '3.8'

services:
  api:
    build:
      context: .
#    command: ['uvicorn', 'src.app.run_api:app', '--host', '0.0.0.0', '--port', '80', '--reload', '--loop', 'uvloop']
    ports:
    - '8020:80'
#    volumes:
#    - ./:/app/
    depends_on:
    - postgres
    - redis
#    environment:
#      -


  postgres:
    image: postgres:17.5-alpine3.21
    restart: always
      # set shared memory limit when using docker compose
    shm_size: 128mb
      # or set shared memory limit when deploy via swarm stack
      #volumes:
      #  - type: tmpfs
      #    target: /dev/shm
      #    tmpfs:
      #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pswd3131
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    image: 'redis:8.0.1-alpine3.21'
    ports:
    - '16379:6379'
