services:
  api:
    build:
      context: .
      target: production
    command: >
      sh -c "alembic upgrade head &&
             uvicorn shorty.entrypoints.fastapi_app:app --host 0.0.0.0 --port 80"
    ports:
    - '8020:80'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &application-environment
      DATABASE_URL: postgresql+asyncpg://admin:pswd3131@postgres:5432/shorty
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET_KEY: change-me
      LINK_TTL_DAYS: 14
      CLEANUP_INTERVAL_MINUTES: 60
      CLEANUP_BATCH_SIZE: 100
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "from urllib.request import urlopen; urlopen('http://localhost/health').read()"
      interval: 5s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      target: production
    command: python -m shorty.entrypoints.scheduler
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *application-environment

  postgres:
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
    - '5432:5432'
    # Allocate shared memory when running with Docker Compose.
    shm_size: 128mb
    # For a Swarm stack, mount /dev/shm as a tmpfs volume instead.
    # volumes:
    # - type: tmpfs
    #   target: /dev/shm
    #   tmpfs:
    #     size: 134217728 # 128 MiB
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pswd3131
      POSTGRES_DB: shorty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    image: 'redis:8.10.3-alpine3.23'
    ports:
    - '16379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 10
